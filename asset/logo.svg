<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7052" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7052" />
      <stop offset="100%" stop-color="#2EC4B6" />
    </linearGradient>
  </defs>

  <!-- Paw Icon -->
  <g transform="translate(4, 5)">
    <!-- Main pad / Heart shape -->
    <path d="M 25,48 C 15,48 10,40 10,32 C 10,24 16,19 25,26 C 34,19 40,24 40,32 C 40,40 35,48 25,48 Z" fill="url(#pawGrad)" />
    <!-- 4 Toe pads -->
    <ellipse cx="12" cy="18" rx="4.5" ry="6" fill="#FF7052" transform="rotate(-25 12 18)" />
    <ellipse cx="20" cy="11" rx="4.5" ry="6.5" fill="#FF7052" transform="rotate(-8 20 11)" />
    <ellipse cx="30" cy="11" rx="4.5" ry="6.5" fill="#FFB703" transform="rotate(8 30 11)" />
    <ellipse cx="38" cy="18" rx="4.5" ry="6" fill="#FFB703" transform="rotate(25 38 18)" />
  </g>

  <!-- Typography -->
  <text x="60" y="32" font-family="'Quicksand', 'Nunito', sans-serif" font-weight="800" font-size="24" fill="#2B2D42" letter-spacing="-0.5">
    Pet <tspan fill="#FF7052">Paradise</tspan>
  </text>
  <text x="62" y="47" font-family="'Quicksand', 'Nunito', sans-serif" font-weight="600" font-size="11" fill="#2EC4B6" letter-spacing="2">
    PET CARE &amp; SHOP
  </text>
</svg>
